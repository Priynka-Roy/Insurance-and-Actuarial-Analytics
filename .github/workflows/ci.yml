name: Quality and deployment readiness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/verify_artifacts.py
      - name: Streamlit startup without raw data or training
        shell: bash
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8504 > /tmp/actuarylab-streamlit.log 2>&1 &
          streamlit_pid=$!
          trap 'kill "$streamlit_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8504/_stcore/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/actuarylab-streamlit.log
          exit 1
