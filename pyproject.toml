[project]
name = "actuarylab-ai"
version = "1.0.0"
description = "Educational exposure-aware motor insurance pricing and portfolio risk analytics"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
